name: CEnT-S monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: cents-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the calendar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CENTS_STATE_PATH: state/state.json
        run: python monitor.py --once

      - name: Save state (only when it changed)
        run: |
          git config user.name "cents-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase origin main && git push)
